<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NextGen Academy — ERP & Learning Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            cofferBg: '#f4f3fa',
            cofferDark: '#0f1018',
            cofferPurple: '#6d4aff',
            cofferLavender: '#ede9fe'
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-cofferBg text-slate-800 dark:bg-cofferDark dark:text-slate-100 min-h-screen transition-colors duration-200">
  <div id="app"></div>

  <!-- Shared Modal for Receipts, ID Cards, Credentials & Password Recovery -->
  <div id="modal-backdrop" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/60 backdrop-blur-sm p-4 print:hidden">
    <div id="modal-card" class="w-full max-w-xl rounded-3xl bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-2xl p-6 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-100 dark:border-slate-800 pb-3 mb-4">
        <h3 id="modal-title" class="text-lg font-bold text-slate-900 dark:text-white">Details</h3>
        <button id="modal-close-btn" type="button" class="rounded-xl px-3 py-1.5 text-sm font-semibold bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700">✕</button>
      </div>
      <div id="modal-body" class="space-y-4 text-sm"></div>
    </div>
  </div>

  <!-- Printable Area -->
  <div id="print-area" class="hidden print:block p-6 bg-white text-slate-900"></div>

  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/teacher.js"></script>
  <script src="js/student.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
